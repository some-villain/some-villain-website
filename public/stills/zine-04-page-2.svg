      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="600" height="800" fill="#ece8dd"/>
  <rect x="60" y="60" width="480" height="420" fill="#3c3860" opacity="0.85"/><circle cx="300" cy="240" r="90" fill="#ece8dd" opacity="0.25"/><rect x="60" y="60" width="480" height="420" fill="none" stroke="#2a2721" stroke-opacity="0.3" stroke-width="2"/><rect x="60" y="520" width="288" height="8" rx="2" fill="#2a2721" opacity="0.55"/><rect x="60" y="542" width="480" height="8" rx="2" fill="#2a2721" opacity="0.55"/><rect x="60" y="564" width="480" height="8" rx="2" fill="#2a2721" opacity="0.55"/><rect x="60" y="610" width="180" height="8" rx="2" fill="#2a2721" opacity="0.55"/><rect x="60" y="632" width="300" height="8" rx="2" fill="#2a2721" opacity="0.55"/><rect x="60" y="654" width="300" height="8" rx="2" fill="#2a2721" opacity="0.55"/><rect x="60" y="676" width="300" height="8" rx="2" fill="#2a2721" opacity="0.55"/>
  <rect width="600" height="800" fill="#000" opacity="0" filter="url(#grain)"/>
</svg>
