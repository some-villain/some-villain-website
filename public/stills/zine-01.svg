<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a441"/>
      <stop offset="0.55" stop-color="#8a5f1c"/>
      <stop offset="1" stop-color="#241703"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#g)"/>
  <rect x="60" y="60" width="480" height="680" fill="none" stroke="#f2f0ea" stroke-opacity="0.35" stroke-width="3"/><rect x="60" y="560" width="480" height="90" fill="#f2f0ea" opacity="0.12"/><circle cx="300" cy="300" r="120" fill="#f2f0ea" opacity="0.1"/>
  <rect width="600" height="800" fill="#000" opacity="0" filter="url(#grain)"/>
</svg>
