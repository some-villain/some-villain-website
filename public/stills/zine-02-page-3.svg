<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="600" height="800" fill="#ece8dd"/>
  <rect x="60" y="60" width="225" height="180" fill="#28505c" opacity="0.85"/><rect x="315" y="60" width="225" height="180" fill="#28505c" opacity="0.55"/><rect x="60" y="270" width="480" height="220" fill="#28505c" opacity="0.85"/><rect x="60" y="520" width="225" height="180" fill="#28505c" opacity="0.55"/><rect x="315" y="520" width="225" height="180" fill="#28505c" opacity="0.85"/><rect x="60" y="730" width="288" height="6" rx="2" fill="#2a2721" opacity="0.55"/><rect x="60" y="748" width="480" height="6" rx="2" fill="#2a2721" opacity="0.55"/>
  <rect width="600" height="800" fill="#000" opacity="0" filter="url(#grain)"/>
</svg>
