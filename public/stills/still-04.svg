<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a414c"/>
      <stop offset="0.55" stop-color="#23272e"/>
      <stop offset="1" stop-color="#0e1013"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#g)"/>
  <rect x="80" y="120" width="280" height="180" fill="#0a0c0f" opacity="0.8"/><circle cx="560" cy="180" r="46" fill="#d8dee8" opacity="0.14"/>
  <rect width="800" height="500" fill="#000" opacity="0" filter="url(#grain)"/>
</svg>
