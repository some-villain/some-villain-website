<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e5238"/>
      <stop offset="0.55" stop-color="#1c3524"/>
      <stop offset="1" stop-color="#08110b"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#g)"/>
  <rect x="200" y="0" width="26" height="500" fill="#08110b" opacity="0.7"/><rect x="520" y="0" width="40" height="500" fill="#08110b" opacity="0.6"/><circle cx="380" cy="170" r="90" fill="#cfe3b8" opacity="0.16"/>
  <rect width="800" height="500" fill="#000" opacity="0" filter="url(#grain)"/>
</svg>
