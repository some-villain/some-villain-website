<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a2020"/>
      <stop offset="0.55" stop-color="#4a1414"/>
      <stop offset="1" stop-color="#160606"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#g)"/>
  <rect x="0" y="0" width="800" height="70" fill="#0a0303" opacity="0.85"/><rect x="0" y="430" width="800" height="70" fill="#0a0303" opacity="0.85"/><circle cx="260" cy="250" r="60" fill="#f0b090" opacity="0.2"/>
  <rect width="800" height="500" fill="#000" opacity="0" filter="url(#grain)"/>
</svg>
